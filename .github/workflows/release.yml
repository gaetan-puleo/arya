name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ldid (ad-hoc signs the macOS binaries so Gatekeeper allows them)
        run: sudo apt-get update && sudo apt-get install -y ldid
      - name: Cross-compile standalone binaries
        run: pnpm compile
      - name: Attach binaries to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arya-*
