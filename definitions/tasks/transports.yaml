# Daily transport check — adapted from mini-openclaw.
# NOTE: the current scheduler runs in UTC and doesn't route through a
# specific primary agent (it spawns a fresh session). The `agent` field
# is informational until the scheduler gains agent-routing.

- id: transports-morning
  agent: transports
  cron: '0 6 * * 1-5'   # 06h UTC = 07h Paris (winter) — adjust to your TZ.
  channel: companion
  prompt: >
    Vérifie les horaires de train actuels pour Rambouillet → Issy-Val-de-Seine.
    Donne les prochains départs, le temps de trajet et les perturbations.

- id: transports-evening
  agent: transports
  cron: '0 16 * * 1-5'  # 16h UTC = 17h Paris (winter).
  channel: companion
  prompt: >
    Vérifie les horaires de train actuels pour Issy-Val-de-Seine → Rambouillet.
    Donne les prochains départs, le temps de trajet et les perturbations.
